<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Password Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container" role="main">
        <h2>Password Manager</h2>
        <button id="logoutBtn" onclick="logoutUser()" style="background-color: #dc3545; color: white;" aria-label="Log out of the application">Log Out</button>
        
        <div class="reminder-settings" style="margin-bottom: 25px; padding: 15px; background: #fff3cd; border: 1px solid #ffeeba; border-radius: 8px;">
            <h3 style="color: #856404; margin-bottom: 10px; font-size: 1.1rem; font-family: Arial, sans-serif;">Password Rotation Settings</h3>
            
            <div id="reminderAlerts" style="margin-bottom: 15px; font-weight: bold; color: #721c24; font-family: Arial, sans-serif;"></div>

            <div class="settings-controls" style="display: flex; gap: 15px; align-items: center; flex-wrap: wrap;">
                <label for="reminderInterval" style="font-size: 0.9rem; color: #856404; font-family: Arial, sans-serif;">Remind me to change passwords every:</label>
                <input type="number" id="reminderInterval" value="90" min="1" style="max-width: 80px; padding: 6px; border: 1px solid #ccc; border-radius: 4px;">
                
                <select id="reminderUnit" style="padding: 6px; border-radius: 4px; border: 1px solid #ccc; background: white;">
                    <option value="days" selected>Days</option>
                    <option value="minutes">Minutes (for testing)</option>
                </select>
                
                <button type="button" id="saveSettingsBtn" onclick="saveReminderSettings()" style="background-color: #ffc107; color: black; padding: 8px 12px; font-weight: bold; border-radius: 4px; cursor: pointer; border: none;">Save Settings</button>
            </div>
        </div>

        <form class="form-group" aria-label="Add new password form">
            <input type="text" id="siteInput" placeholder="Website Name" aria-label="Website Name">
            <input type="text" id="passInput" placeholder="Password" aria-label="Password">
            <button id="addBtn" onclick="addPassword()" aria-label="Add password to vault">Add Password</button>
        </form>

        <div id="passwordContainer" class="password-grid" aria-live="polite" aria-label="Stored passwords list">
        </div>
    </div>

    <div class="quiz-section" aria-labelledby="quizHeading">
        <h2 id="quizHeading">Password Review Quiz</h2>
        <button id="startQuizBtn" onclick="toggleQuiz()" aria-label="Start flashcard quiz">Start Flashcard Quiz</button>
        
        <div id="quizContainer" class="quiz-container" style="display: none;">
            <div class="flashcard" id="flashcard" onclick="flipCard()" role="button" aria-label="Flashcard: Click to flip and reveal password">
                <div class="flashcard-inner" id="flashcardInner">
                    <div class="flashcard-front">
                        <p>Website</p>
                        <h3 id="quizSite">Click Start</h3>
                    </div>
                    <div class="flashcard-back">
                        <p>Password</p>
                        <h3 id="quizPass">****</h3>
                    </div>
                </div>
            </div>
            <div class="quiz-controls">
                <button onclick="nextCard()" aria-label="Show next flashcard">Next Card</button>
            </div>
        </div>
    </div>
<script src="js/passwords_script.js"></script>
</body>
</html>
