<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyPasswords.com - Secure Password Manager</title>
    <!-- Link to the external CSS file -->
    <link rel="stylesheet" href="homepage_style.css">
</head>
<body>

    <main class="login-container">
        <div class="brand">
            <h1>Sign In to MyPasswords.com</h1>
            <p>Access your secure vault</p>
        </div>

        <form id="loginForm" action="passwords.html" method="POST" aria-label="Login form" novalidate>
            <div class="form-group">
                <label for="username">Username or Email</label>
                <input type="text" id="username" name="username" required
                    autocomplete="username"
                    aria-required="true"
                    aria-describedby="username-error">
                <span id="username-error" class="error-msg" role="alert" hidden></span>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-input-wrapper">
                    <input type="password" id="password" name="password" required
                        autocomplete="current-password"
                        aria-required="true"
                        aria-describedby="password-error">
                    <button type="button" id="togglePassword" class="toggle-btn"
                        aria-label="Show password"
                        aria-pressed="false">Show</button>
                </div>
                <span id="password-error" class="error-msg" role="alert" hidden></span>
            </div>

            <button type="submit" class="btn-submit">Sign In</button>
        </form>

        <nav class="footer-links" aria-label="Account assistance">
            <a href="#forgot">Forgot Password?</a>
            <span class="divider" aria-hidden="true">|</span>
            <a href="#signup">Create an Account</a>
        </nav>
    </main>

    <script type='module' src="js/homepage_script.js"></script>
</body>
</html>
