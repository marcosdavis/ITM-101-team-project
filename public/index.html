<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyPasswords.com - Secure Password Manager</title>
    <!-- Link to the external CSS file -->
    <link rel="stylesheet" href="homepage_style.css">
</head>
<body>

    <div class="login-container">
        <div class="brand">
            <h1>MyPasswords.com</h1>
            <p>Access your secure vault</p>
        </div>

        <form id="loginForm" action="passwords.html" method="POST">
            <div class="form-group">
                <label for="username">Username or Email</label>
                <input type="text" id="username" name="username" required autocomplete="username" placeholder="Enter your username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-input-wrapper">
                    <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Enter your password">
                    <button type="button" id="togglePassword" class="toggle-btn">Show</button>
                </div>
            </div>

            <button type="submit" class="btn-submit">Sign In</button>
        </form>

        <div class="footer-links">
            <a href="#forgot">Forgot Password?</a>
            <span class="divider">|</span>
            <a href="#signup">Create an Account</a>
        </div>
    </div>

    <!-- Link to the external JavaScript file -->
    <script src="js/homepage_script.js"></script>
</body>
</html>
